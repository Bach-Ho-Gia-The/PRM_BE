# Gửi email giao dịch (OTP quên mật khẩu). Chưa đặt BREVO_API_KEY thì endpoint quên mật khẩu
# trả 503 chứ không im lặng nuốt lỗi.
brevo:
  api-key: ${BREVO_API_KEY:}
  sender-email: ${BREVO_SENDER_EMAIL:no-reply@example.com}
  sender-name: ${BREVO_SENDER_NAME:La Boutique}

