server:
  port: ${SERVER_PORT:8088}
  forward-headers-strategy: framework # Bắt buộc có để nhận diện đúng HTTPS phía sau Nginx/Cloudflare
  servlet:
    context-path: ${CONTEXT_PATH:/api/v1}

spring:
  application:
    name: ${APP_NAME:core-backend-service}

  # Tự động nạp file .env khi chạy Local
  config:
    import: optional:file:.env[.properties]

# ----------------------------------------------------
# TẮC TỰ ĐỘNG BẬT DOCKER COMPOSE KHI RUN TRÊN INTELLIJ
# ----------------------------------------------------
  docker:
    compose:
      enabled: ${SPRING_DOCKER_COMPOSE_ENABLED:false}

  # ==========================================
  # CƠ SỞ DỮ LIỆU CHÍNH (POSTGRESQL)
  # ==========================================
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:app_db}?sslmode=${DB_SSL_MODE:disable}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:123456}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: ${DB_POOL_SIZE:20}
      # Cặp auto-commit=false + provider_disables_autocommit=true bên dưới là BẮT BUỘC đi chung.
      # Mặc định Hibernate mượn connection NGAY khi mở @Transactional chỉ để tắt autocommit; khi
      # trong transaction có lời gọi mạng (upload ảnh Cloudinary) thì connection bị giam suốt
      # thời gian chờ mạng. Báo trước cho Hibernate biết pool đã tắt autocommit thì nó hoãn việc
      # mượn tới câu SQL đầu tiên.
      auto-commit: false

  jpa:
    hibernate:
      # Local để 'update', Deploy chuyển biến DDL_AUTO thành 'validate' hoặc 'none'
      ddl-auto: ${DDL_AUTO:update}
    show-sql: ${SHOW_SQL:false}
    # Mặc định của Boot là true: giữ session Hibernate sống tới tận lúc ghi response. Nghe thì
    # tiện, nhưng nó giam connection suốt vòng đời request và che mất lỗi lazy — code sai vẫn
    # chạy ngon ở máy dev rồi vỡ khi lên thật. Tắt đi để lỗi lộ ra ngay tại chỗ sai.
    open-in-view: false
    properties:
      hibernate:
        format_sql: false
        dialect: org.hibernate.dialect.PostgreSQLDialect
        jdbc:
          time_zone: ${APP_TIMEZONE:Asia/Ho_Chi_Minh}
        connection:
          # Đi kèm spring.datasource.hikari.auto-commit=false ở trên. Thiếu một trong hai là mất
          # tác dụng; bật riêng cái này mà pool vẫn autocommit=true thì dữ liệu ghi sai transaction.
          provider_disables_autocommit: true

  # ==========================================
  # PHÂN TRANG
  # ==========================================
  data:
    web:
      pageable:
        # @PageableDefault ở controller chỉ đặt cỡ trang MẶC ĐỊNH, không chặn trần. Không khai
        # dòng này thì Spring cho tới 2000 bản ghi một lượt: ?size=2000 kéo sập cả bộ nhớ lẫn DB.
        max-page-size: 100
        default-page-size: 20

    # ==========================================
    # CACHE & SESSION (REDIS)
    # ==========================================
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      ssl:
        enabled: ${REDIS_SSL:false}
      timeout: ${REDIS_TIMEOUT:10000ms}

  jackson:
    time-zone: ${APP_TIMEZONE:Asia/Ho_Chi_Minh}

  servlet:
    multipart:
      max-file-size: ${UPLOAD_MAX_FILE_SIZE:10MB}
      max-request-size: ${UPLOAD_MAX_REQUEST_SIZE:15MB}

  # ==========================================
  # (OPTIONAL) MONGODB - Mở comment khi dự án cần NoSQL
  # ==========================================
  # mongodb:
  #   uri: ${MONGODB_URI:mongodb://localhost:27017/app_chat}

  # Không cấu hình spring.security.oauth2.client: dự án đi đường "frontend lấy ID token rồi
  # gửi về backend" (POST /auth/google), backend không tham gia luồng redirect nên không cần
  # client-secret lẫn registration. Client ID nằm ở app.auth.google.client-id bên dưới.

# ==========================================
# CẤU HÌNH HỆ THỐNG DÙNG CHUNG (CORE APP)
# ==========================================
app:
  account:
    # Khoảng chờ giữa hai lần đổi mật khẩu THÀNH CÔNG của cùng một tài khoản. Mỗi lần đổi đều
    # gửi mail báo tin và đá mọi thiết bị, không hãm lại là biến chức năng này thành vũ khí.
    # Không áp cho luồng quên mật khẩu — đường đó đã có cooldown OTP riêng.
    password-change-cooldown: ${PASSWORD_CHANGE_COOLDOWN:5m}

  # Tạo sẵn role ADMIN/USER + 2 tài khoản demo lúc khởi động. Deploy thật thì đặt false.
  data-init:
    enabled: ${DATA_INIT_ENABLED:true}
    admin-password: ${DATA_INIT_ADMIN_PASSWORD:Admin@12345}
    user-password: ${DATA_INIT_USER_PASSWORD:User@12345}
  api:
    version: 1.0.0
    description: Core Backend Service APIs
  cors:
    # ⚠ PHẢI là chuỗi MỘT DÒNG ngăn bằng dấu phẩy, KHÔNG được viết thành list YAML.
    # SecurityConfig đọc bằng @Value, mà @Value không nhìn thấy list YAML: list bị tách thành
    # các khoá đánh chỉ số allowed-origins[0], allowed-origins[1]... nên khoá allowed-origins
    # không tồn tại và placeholder âm thầm rơi về giá trị mặc định -> FRONTEND_BASE_URL bị bỏ qua
    # hoàn toàn. Local vẫn chạy vì mặc định có sẵn localhost, lỗi chỉ nổ đúng lúc deploy.
    allowed-origins: ${FRONTEND_BASE_URL:http://localhost:5173,http://localhost:3000}
  security:
    # Sai quá max-attempts lần trong lock-duration -> khoá tạm, trả 429
    login-attempt:
      max-attempts: ${LOGIN_MAX_ATTEMPTS:5}
      # Ngưỡng theo IP nới hơn hẳn ngưỡng theo username: một văn phòng / mạng di động đi chung NAT
      # thì rất nhiều người thật cùng ra một IP, siết chặt là chặn nhầm người dùng hợp lệ.
      max-attempts-per-ip: ${LOGIN_MAX_ATTEMPTS_PER_IP:20}
      lock-duration: ${LOGIN_LOCK_DURATION:15m}
    # Category/Product public có tiền tố /id và /slug; /categories/admin và /products/admin không được mở.
    whitelist: "/auth/**,/categories,/categories/id/**,/categories/slug/**,/products,/products/id/**,/products/slug/**,/collections,/collections/slug/**,/stores,/stores/id/**"
  # ==========================================
  # QUY TẮC ĐẶT HÀNG
  # ==========================================
  order:
    # Phí ship mặc định. Miễn phí khi chuyển khoản hoặc khi đơn đạt ngưỡng bên dưới.
    shipping-fee: ${ORDER_SHIPPING_FEE:30000}
    free-shipping-threshold: ${ORDER_FREE_SHIPPING_THRESHOLD:1000000}

  jwt:
    secret: ${JWT_SIGNER_KEY:defaultSecretKeyForLocalDevMustBeAtLeast32BytesLong123456}
    access-ttl: ${JWT_ACCESS_TTL:15m}
    refresh-ttl: ${JWT_REFRESH_TTL:7d}
  auth:
    cookie:
      access-token-name: ${AUTH_ACCESS_COOKIE_NAME:access_token}
      refresh-token-name: ${AUTH_COOKIE_NAME:refresh_token}
      # Local: false | Deploy: true (bắt buộc HTTPS)
      secure: ${AUTH_COOKIE_SECURE:false}
      # Local: Lax | Deploy: None (nếu FE và BE khác domain)
      same-site: ${AUTH_COOKIE_SAME_SITE:Lax}
      path: ${AUTH_COOKIE_PATH:/}
    # Đăng nhập Google. Chỉ cần client-id (để kiểm claim "aud"), KHÔNG cần client-secret vì
    # frontend tự lấy ID token rồi gửi về, backend không tham gia luồng redirect của OAuth2.
    google:
      client-id: ${GOOGLE_CLIENT_ID:}
  # Mã OTP khôi phục mật khẩu. ttl ngắn vì mã 6 số chỉ có 10^6 tổ hợp; max-attempts mới là
  # thứ chặn dò thật sự, còn verified-ttl là hạn của "vé tạm" cấp sau khi nhập đúng mã.
  otp:
    ttl-seconds: ${OTP_TTL_SECONDS:90}
    max-attempts: ${OTP_MAX_ATTEMPTS:5}
    verified-ttl-seconds: ${OTP_VERIFIED_TTL_SECONDS:300}
    max-sends-per-hour: ${OTP_MAX_SENDS_PER_HOUR:5}
    register-ttl-seconds: ${OTP_REGISTER_TTL_SECONDS:600}
    resend-cooldown-seconds: ${OTP_RESEND_COOLDOWN_SECONDS:20}

  payment:
    vnpay:
      tmn-code: ${VNPAY_TMN_CODE}
      hash-secret: ${VNPAY_HASH_SECRET}
      payment-url: ${VNPAY_PAYMENT_URL}
      api-url: ${VNPAY_API_URL}
      return-url: ${VNPAY_RETURN_URL}
      payment-timeout: ${VNPAY_PAYMENT_TIMEOUT}

      version: "2.1.0"
      command: pay
      currency: VND
      locale: vn
      order-type: other
      zone-id: Asia/Ho_Chi_Minh

# ==========================================
# CLOUDIRARY - UPLOAD ẢNH
# ==========================================
cloudinary:
  cloud-name: ${CLOUDINARY_CLOUD_NAME:}
  api-key: ${CLOUDINARY_API_KEY:}
  api-secret: ${CLOUDINARY_API_SECRET:}
  folder-prefix: ${CLOUDINARY_FOLDER_PREFIX:prm/dev}
  max-file-size: ${CLOUDINARY_MAX_FILE_SIZE:5MB}
  allowed-formats: ${CLOUDINARY_ALLOWED_FORMATS:jpg,png,webp}
  # 10s thay vì 30s: đây là trần thời gian một request upload có thể treo. Càng dài thì khi
  # Cloudinary chậm, càng nhiều request nằm chờ và càng dễ cạn connection pool.
  timeout: ${CLOUDINARY_TIMEOUT:10s}

  quota:
    enabled: ${CLOUDINARY_QUOTA_ENABLED:true}
    block-at-percent: ${CLOUDINARY_QUOTA_BLOCK_AT_PERCENT:75}
    cache-ttl: ${CLOUDINARY_QUOTA_CACHE_TTL:5m}
    retry-delay: ${CLOUDINARY_QUOTA_RETRY_DELAY:30s}

# ==========================================
# TÀI LIỆU API (SWAGGER / OPENAPI)
# ==========================================
springdoc:
  api-docs:
    enabled: ${SWAGGER_ENABLED:true} # Deploy có thể truyền biến false để tắt
    path: /v3/api-docs
  swagger-ui:
    enabled: ${SWAGGER_ENABLED:true}
    path: /swagger-ui.html
    operations-sorter: method
    tags-sorter: alpha
    display-request-duration: true
  show-actuator: false
  default-produces-media-type: application/json

# ==========================================
# ACTUATOR HEALTH CHECK (Dùng cho DevOps / Monitoring)
# ==========================================
management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: when-authorized
  health:
    defaults:
      enabled: true
    # Spring Boot thấy driver Mongo trong classpath là tự bật MongoHealthIndicator, mà dự án
    # không dùng Mongo ⇒ /actuator/health luôn DOWN và k8s sẽ liên tục restart pod đang khoẻ.
    # Tên khoá là "mongodb", KHÔNG phải "mongo": Boot 4.0 đã đổi (gh-47050) và đánh dấu khoá cũ
    # ở mức "error" — viết "mongo" thì Spring bỏ qua im lặng, health check vẫn chạy như thường.
    mongodb:
      enabled: false

# ==========================================
# (OPTIONAL) CÁC DỊCH VỤ NGOÀI - MỞ COMMENT KHI SỬ DỤNG
# ==========================================
# socket:
#   server:
#     host: ${SOCKET_SERVER_HOST:0.0.0.0}
#     port: ${SOCKET_SERVER_PORT:9092}

# supabase:
#   url: ${SUPABASE_URL:}
